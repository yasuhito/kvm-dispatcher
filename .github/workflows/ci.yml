name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  host-validation:
    name: Host validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq shellcheck

      - name: Run host tests, shell checks, systemd verification, and polkit checks
        run: host/kvm_dispatcher_host_test.sh
