# Install next to the repository's 10-isolation.conf as
# /etc/systemd/system/qoral-runner-job@.service.d/20-job-runtime.conf. Keep both files.
# RuntimeDirectory= is a list, so the empty assignment drops the shared qoral-runner
# directory from 10-isolation.conf before each job gets its own directory.
[Service]
Restart=no
MemoryAccounting=yes
RuntimeDirectory=
RuntimeDirectory=qoral-runner-job-%i
RuntimeDirectoryMode=0700
